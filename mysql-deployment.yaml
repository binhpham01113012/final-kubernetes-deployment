apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - "--innodb-buffer-pool-size=64M"
            - "--max-connections=30"
            - "--performance-schema=OFF"
          ports:
            - containerPort: 3306
          envFrom:
            - configMapRef:
                name: mysql-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  MYSQL_PWD="$MYSQL_PASSWORD"
                  mysql --protocol=TCP -h 127.0.0.1
                  -u "$MYSQL_USER" "$MYSQL_DATABASE"
                  -e "SELECT 1"
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
