apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      securityContext:
        fsGroup: 200
      containers:
        - name: nexus
          image: sonatype/nexus3:3.94.4
          ports:
            - containerPort: 8081
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: "-Xms256m -Xmx768m -XX:MaxDirectMemorySize=384m -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
          resources:
            requests:
              memory: "768Mi"
              cpu: "100m"
            limits:
              memory: "1536Mi"
          volumeMounts:
            - name: nexus-storage
              mountPath: /nexus-data
          readinessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: nexus-storage
          persistentVolumeClaim:
            claimName: nexus-pvc
